

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="55%" stop-color="#17102D"/>
      <stop offset="100%" stop-color="#071B20"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".1"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity=".8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>

  <g fill="none" stroke="url(#wave)" stroke-width="1.5">
    <path d="M0 160 Q125 65 250 145 T500 130 T750 110 T1000 145">
      <animate attributeName="d"
        values="M0 160 Q125 65 250 145 T500 130 T750 110 T1000 145;M0 130 Q125 180 250 110 T500 155 T750 80 T1000 130;M0 160 Q125 65 250 145 T500 130 T750 110 T1000 145"
        dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 180 Q125 100 250 165 T500 145 T750 140 T1000 170">
      <animate attributeName="d"
        values="M0 180 Q125 100 250 165 T500 145 T750 140 T1000 170;M0 145 Q125 200 250 135 T500 170 T750 105 T1000 155;M0 180 Q125 100 250 165 T500 145 T750 140 T1000 170"
        dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <g stroke="#8B5CF6" stroke-width=".8" stroke-opacity=".6">
    <path d="M80 95 L170 135 L245 70 L330 120 L405 55 L490 105 L580 65 L665 125 L750 75 L840 115 L930 65"/>
    <path d="M120 205 L205 160 L295 205 L380 155 L465 200 L555 150 L640 205 L730 160 L815 205 L900 155"/>
  </g>

  <g fill="#A78BFA">
