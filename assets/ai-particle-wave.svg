    <circle cx="170" cy="135" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="70" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="120" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="405" cy="55" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="105" r="6"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="65" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="665" cy="125" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="75" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="115" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="65" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#2DD4BF">
    <circle cx="120" cy="205" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="295" cy="205" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="465" cy="200" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="205" r="5"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="205" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="monospace" text-anchor="middle">
    <text x="500" y="115" fill="#FFFFFF" font-size="28" font-weight="700" letter-spacing="3">DATA SCIENCE</text>
    <text x="500" y="143" fill="#A78BFA" font-size="15" letter-spacing="5">INTELLIGENCE IN MOTION</text>
    <text x="500" y="232" fill="#2DD4BF" font-size="10" letter-spacing="3">AI / MACHINE LEARNING / INNOVATION</text>
  </g>
